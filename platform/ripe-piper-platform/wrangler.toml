name = "ripe-piper-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# The static website runs on Cloudflare Pages. This Worker answers only these paths on the same domain.
routes = [
  { pattern = "ripepiper.com/api/*", zone_name = "ripepiper.com" },
  { pattern = "ripepiper.com/webhooks/*", zone_name = "ripepiper.com" },
  { pattern = "ripepiper.com/p/*", zone_name = "ripepiper.com" },
  { pattern = "ripepiper.com/blog*", zone_name = "ripepiper.com" },
]

[triggers]
# Every 5 minutes: reminders, post-call AI notes, Google Sheet sync. Daily at 22:00 UTC (02:00 GST): ad data.
crons = ["*/5 * * * *", "0 22 * * *"]

[vars]
SITE_URL = "https://ripepiper.com"
GOOGLE_CALENDAR_ID = "primary"
AI_MODEL = "claude-sonnet-5-5"
MAIL_FROM = "Ripe Piper <hello@ripepiper.com>"
WHATSAPP_ENABLED = "false"
MEETING_TRANSCRIPTS_ENABLED = "false"
SHEETS_SYNC_ENABLED = "false"
ADS_SYNC_ENABLED = "false"
REVIVE_AUTOMATION_ENABLED = "false"

# Secrets (set each with: npx wrangler secret put NAME)
# SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY,
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN, CRM_SHEET_ID, ADMIN_ALERT_EMAIL,
# ANTHROPIC_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET,
# GOOGLE_ADS_DEVELOPER_TOKEN, GOOGLE_ADS_LOGIN_CUSTOMER_ID, META_ACCESS_TOKEN, LINKEDIN_ACCESS_TOKEN,
# TURNSTILE_SECRET, WHATSAPP_TOKEN, WHATSAPP_PHONE_ID
