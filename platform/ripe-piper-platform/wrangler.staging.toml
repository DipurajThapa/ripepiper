# Prepared only. No deployment is authorized by this file.
# Deliberately separate from production wrangler.toml: no custom routes or cron.
name = "ripe-piper-api-staging"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = []

[triggers]
crons = []

[vars]
SITE_URL = "https://ripe-piper-api-staging.dipuraj-thapa.workers.dev"
GOOGLE_CALENDAR_ID = "unconfigured-staging-calendar"
AI_MODEL = "unconfigured"
MAIL_FROM = "Ripe Piper Test <test@example.invalid>"
PAID_AI_ENABLED = "false"
MEETING_TRANSCRIPTS_ENABLED = "false"
SHEETS_SYNC_ENABLED = "false"
ADS_SYNC_ENABLED = "false"
SYNTHETIC_SINK_ENABLED = "true"
REVIVE_AUTOMATION_ENABLED = "false"
# Add only the isolated Supabase URL/keys through secure environment setup.
# No production key, global Google send/calendar grant, payment key or AI key.
# Configure permitted read-only tenant Google bindings separately after consent.

# Existing site copied by the same preview builder, public staging anon key only.
[assets]
directory = "../../.staging-site"
binding = "ASSETS"
run_worker_first = ["/api/*", "/p/*", "/blog", "/blog/*"]
not_found_handling = "none"
