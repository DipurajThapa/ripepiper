name: Ripe Piper review checks
on:
  push:
    branches: [main, 'review/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify source layout
        run: |
          test -f site/index.html
          test -f platform/ripe-piper-platform/package.json
          test -f platform/ripe-piper-platform/package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: platform/ripe-piper-platform/package-lock.json
      - name: Install dependencies
        working-directory: platform/ripe-piper-platform
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: platform/ripe-piper-platform
        run: npm run typecheck
      - name: Test
        working-directory: platform/ripe-piper-platform
        run: npm test
      - name: Check frontend JavaScript syntax
        run: find site/assets -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
