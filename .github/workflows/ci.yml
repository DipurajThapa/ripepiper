name: Ripe Piper review checks
on:
  push:
    branches: [main, 'review/**', 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify source layout
        run: |
          test -f site/index.html
          test -f platform/ripe-piper-platform/package.json
          test -f platform/ripe-piper-platform/package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: platform/ripe-piper-platform/package-lock.json
      - name: Install dependencies
        working-directory: platform/ripe-piper-platform
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        working-directory: platform/ripe-piper-platform
        run: npm run typecheck
      - name: Test
        working-directory: platform/ripe-piper-platform
        run: npm test
      - name: Prevent simulated booking confirmations
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const source = readFileSync("site/assets/site.js", "utf8");
            if (!source.includes("Calendar booking requires the deployed Ripe Piper website")) process.exit(1);
            if (source.includes("Sample only: on the live website, this is your Cal.com calendar.")) process.exit(1);
            if (source.includes("We have sent a calendar invitation to your email. You will receive reminders 24 hours")) process.exit(1);
          '
      - name: Check frontend JavaScript syntax
        run: find site/assets -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
      - name: Development safety acceptance
        run: node --test scripts/safety.test.mjs
      - name: Dependency security gate
        working-directory: platform/ripe-piper-platform
        run: npm audit --audit-level=high
      - name: Build isolated UI preview
        run: node scripts/preview.mjs build
