name: Ripe Piper review checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "Publish the approved isolated staging Worker after checks (never production)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source layout
        run: |
          test -f site/index.html
          test -f platform/ripe-piper-platform/package.json
          test -f platform/ripe-piper-platform/package-lock.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: platform/ripe-piper-platform/package-lock.json
      - name: Install dependencies
        working-directory: platform/ripe-piper-platform
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        working-directory: platform/ripe-piper-platform
        run: npm run typecheck
      - name: Test
        working-directory: platform/ripe-piper-platform
        run: npm test
      - name: Prevent simulated booking confirmations
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const source = readFileSync("site/assets/site.js", "utf8");
            if (!source.includes("Calendar booking requires the deployed Ripe Piper website")) process.exit(1);
            if (source.includes("Sample only: on the live website, this is your Cal.com calendar.")) process.exit(1);
            if (source.includes("We have sent a calendar invitation to your email. You will receive reminders 24 hours")) process.exit(1);
          '
      - name: Check frontend JavaScript syntax
        run: find site/assets -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
      - name: Development safety acceptance
        run: node --test scripts/*.test.mjs
      - name: Dependency security gate
        timeout-minutes: 4
        run: node scripts/dependency-audit.mjs
      - name: Build isolated UI preview
        run: node scripts/preview.mjs build
      - name: Install Chromium for rendered UI checks
        timeout-minutes: 4
        working-directory: platform/ripe-piper-platform
        run: npx --no-install playwright install --with-deps chromium
      - name: Rendered product workflow checks
        timeout-minutes: 2
        run: |
          node scripts/product-browser-check.mjs
          node scripts/signal-browser-check.mjs

  staging:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_staging == true && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.RIPEPIPER_STAGING_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e888301f7b7d01c16eb17c947ff57e5e
      RIPEPIPER_STAGING_SUPABASE_URL: https://wgomywhuzyboxlckopca.supabase.co
      RIPEPIPER_STAGING_SERVICE_ROLE_KEY: ${{ secrets.RIPEPIPER_STAGING_SERVICE_ROLE_KEY }}
      RIPEPIPER_STAGING_ANON_KEY: ${{ secrets.RIPEPIPER_STAGING_ANON_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the verified dependency set
        working-directory: platform/ripe-piper-platform
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate isolated target without revealing secrets
        run: node scripts/staging-bindings.mjs
      - name: Publish only the separately named staging Worker
        working-directory: platform/ripe-piper-platform
        run: npx --no-install wrangler deploy --config wrangler.staging.toml
      - name: Bind only isolated database secrets
        run: node scripts/staging-bindings.mjs --apply
      - name: Verify Worker routing identity
        run: node scripts/runtime-probe.mjs https://ripe-piper-api-staging.dipuraj-thapa.workers.dev
      - name: Verify isolated Auth, PostgREST and Worker boundaries
        run: node scripts/staging-http-acceptance.mjs --apply
